<script>
(function () {
  // Cmd/Ctrl+P on the live deck prints the print view instead: loaded out of
  // sight in a frame, it opens the dialog itself once its pages are laid out.
  if (!/print-pdf/gi.test(window.location.search)) {
    window.addEventListener('keydown', function (event) {
      if (!(event.metaKey || event.ctrlKey) || event.altKey || event.shiftKey ||
          event.key.toLowerCase() !== 'p') return;
      event.preventDefault();
      event.stopImmediatePropagation();
      var old = document.querySelector('iframe.deck-print-frame');
      if (old) old.remove();
      var url = new URL(location.href);
      url.hash = '';
      url.search = '?print-pdf&pdfMaxPagesPerSlide=1&save-pdf';
      var frame = document.createElement('iframe');
      frame.className = 'deck-print-frame';
      frame.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;' +
        'visibility:hidden;pointer-events:none';
      frame.src = url.href;
      document.body.appendChild(frame);
    }, true);
    return;
  }
  function fitPagesToDeck() {
    // Reveal owns the inset frame; the PDF page is the same fixed outer stage
    // used live and by annotations.
    // Chromium stores custom paper sizes in hundredths of an inch. The
    // authored 2106px height therefore becomes 2108.16 CSS px (21.96in) in the
    // PDF MediaBox. Use that same printable height for the page box so its
    // background and right rail reach the physical edge without creating a
    // second fragment. The authored canvas is 3744 x 2106; stored ink stays in
    // 1248 x 702 units and the overlay scales it to the MediaBox.
    var pageW = 3744, pageH = 2108.16;
    var contentX = 336, contentY = 120, contentW = 3072, contentH = 1845;
    var st = document.createElement('style');
    st.textContent = '@page{size:' + pageW + 'px ' + pageH + 'px;margin:0}' +
      // A browser set to always show scrollbars would print them on code blocks.
      '.pdf-page,.pdf-page *{scrollbar-width:none!important}';
    document.head.appendChild(st);
    document.body.style.width = pageW + 'px';
    document.querySelectorAll('.pdf-page').forEach(function (page) {
      page.style.width = pageW + 'px';
      page.style.height = pageH + 'px';
      page.style.position = 'relative';
      page.style.background = '#fff';
      page.style.isolation = 'isolate';
      // A transform makes the page box monolithic for CSS fragmentation
      // (the same reason decktape's live-view capture never lost content:
      // Reveal's transform:scale() was in the ancestor chain). Without it,
      // print fragmentation pushes any monolithic child that doesn't fit
      // the remaining page space (an <img>, or a line of inline-block
      // ::: columns) wholly onto the next page, where pdfMaxPagesPerSlide=1
      // clips it to nothing. Each .pdf-page exactly fits one printed page,
      // so as one monolithic unit its overflow is simply clipped in place —
      // matching the live view.
      page.style.transform = 'scale(1)';
      // Reveal may have positioned the slide before our final @page rule.
      // Align it to the authored canvas rather than retaining a stale margin.
      var slide = page.querySelector('section');
      if (slide) {
        slide.style.setProperty('left', '0px', 'important');
        // Reveal offsets the section 35px down and stretches it to the page
        // height, so its box crosses the printed page's bottom edge — which
        // makes CSS fragmentation run inside it, pushing any monolithic
        // child (<img>, inline-block ::: columns) that straddles the edge
        // wholly onto the next page, where pdfMaxPagesPerSlide=1 clips it
        // to nothing. Start the box at 0 instead and move it down with a
        // transform: same visual position, but the box no longer crosses
        // the page edge (and a transformed box is itself monolithic), so
        // overflow is simply clipped in place like the live view.
        var top = slide.offsetTop;
        slide.style.setProperty('top', '0px', 'important');
        slide.style.setProperty('width', contentW + 'px', 'important');
        slide.style.setProperty(
          'transform', 'translate(' + contentX + 'px,' + (contentY + top) + 'px)',
          'important'
        );
        // With the box inside the page, overflow:hidden makes the section a
        // scroll container — monolithic in CSS fragmentation — so content
        // taller than the page (e.g. a ::: columns line-box with a portrait
        // image) is clipped in place rather than pushed. This needs an
        // explicit height (auto would collapse the clip to the content).
        //
        slide.style.setProperty('height', contentH + 'px', 'important');
        // Clip where the live deck does: slide-stage's clip-path on .slides
        // lets content run 0.5em past the sides and on into the top and
        // bottom bands, so the print and its baked previews must too.
        var em = parseFloat(getComputedStyle(document.querySelector('.reveal .slides')).fontSize);
        var y = contentY + top;
        slide.style.setProperty('overflow', 'visible', 'important');
        slide.style.setProperty('clip-path', 'inset(' + (-y) + 'px ' + (-em / 2) + 'px ' +
          (y + contentH - pageH) + 'px ' + (-em / 2) + 'px)', 'important');
      }

      // Reveal keeps a separate background element beside the section. Like
      // the live deck's, it fills the whole page.
      var background = page.querySelector('.slide-background');
      if (background) {
        background.style.setProperty('left', '0px', 'important');
        background.style.setProperty('top', '0px', 'important');
        background.style.setProperty('width', pageW + 'px', 'important');
        background.style.setProperty('height', pageH + 'px', 'important');
      }

      var chrome = document.createElement('div');
      chrome.className = 'deck-print-chrome' +
        (slide && slide.id === 'title-slide' ? ' deck-print-title' : '');
      chrome.style.zIndex = '-1';
      page.appendChild(chrome);
    });
  }
  function fixSlideNumbers() {
    // Reveal's print view numbers pages with a flat counter (innerHTML=v++),
    // ignoring the slideNumber format and data-visibility="uncounted" (the
    // auto-agenda divider slides here). Recompute live-view numbers: the
    // 1-based position among counted slides, formatted like SlideNumber's
    // "c" / "c/t" markup. (Reveal's own getSlidePastCount/getTotalSlides
    // can't be used — they query .slides>section, which the print view's
    // .pdf-page wrappers no longer match.)
    var format = window.Reveal && typeof Reveal.getConfig === 'function'
      ? Reveal.getConfig().slideNumber : null;
    if (format !== 'c' && format !== 'c/t') return;
    var pages = Array.prototype.slice.call(document.querySelectorAll('.pdf-page'));
    var entries = pages.map(function (page) {
      var slide = page.querySelector('section');
      return {
        el: page.querySelector('.slide-number'),
        uncounted: !!(slide && slide.getAttribute('data-visibility') === 'uncounted'),
      };
    });
    var total = entries.filter(function (e) { return !e.uncounted; }).length;
    var past = 0;
    entries.forEach(function (e) {
      var current = past + (e.uncounted ? 0 : 1);
      if (e.el) {
        // The spaces between spans render as "x / y", matching live view
        // (Reveal's formatNumber template has whitespace between the spans).
        e.el.innerHTML = '<span class="slide-number-a">' + current + '</span>' +
          (format === 'c/t'
            ? ' <span class="slide-number-delimiter">/</span> ' +
              '<span class="slide-number-b">' + total + '</span>'
            : '');
      }
      if (!e.uncounted) past++;
    });
  }
  // Quarto's per-slide footers are missing from Reveal's print view: in live
  // mode the support plugin clones the current slide's .footer up to the
  // viewport on each slide change, but skips that when printing. Copy each
  // slide's own footer, or the deck's default one (honouring
  // data-footer="false"), into its page; the stylesheet places it there as it
  // does on the live stage.
  function placeFooters() {
    var defaultFooter = document.querySelector('.footer-default');
    document.querySelectorAll('.pdf-page').forEach(function (page) {
      var slide = page.querySelector('section');
      if (!slide) return;
      var footer = slide.querySelector('.footer');
      if (!footer && defaultFooter && slide.getAttribute('data-footer') !== 'false') {
        footer = defaultFooter;
      }
      if (!footer) return;
      var copy = footer.cloneNode(true);
      copy.classList.remove('footer-default');
      copy.style.cssText = 'display:block;position:absolute;z-index:2;';
      page.style.position = 'relative';
      page.appendChild(copy);
    });
  }
  // Reveal's print view is set up asynchronously (and fires pdf-ready when
  // done); poll as a fallback in case Reveal was ready before this ran.
  var done = false;
  function run() {
    if (!done) { done = true; fitPagesToDeck(); fixSlideNumbers(); placeFooters(); if (/[?&]save-pdf(&|$)/.test(location.search)) saveAfterLoad(); }
  }
  // Loaded by Cmd/Ctrl+P on the live deck: print once fonts and images are in.
  function saveAfterLoad() {
    var loaded = document.readyState === 'complete' ? Promise.resolve()
      : new Promise(function (resolve) { window.addEventListener('load', resolve, { once: true }); });
    var fonts = document.fonts ? document.fonts.ready : Promise.resolve();
    var images = Array.prototype.map.call(document.images, function (img) {
      return img.complete ? null : new Promise(function (resolve) {
        img.addEventListener('load', resolve, { once: true });
        img.addEventListener('error', resolve, { once: true });
      });
    });
    Promise.all([loaded, fonts].concat(images)).then(function () {
      setTimeout(function () {
        window.print();
        if (window.frameElement) window.frameElement.remove();
      }, 0);
    });
  }
  if (window.Reveal && typeof Reveal.on === 'function') {
    Reveal.on('pdf-ready', run);
  }
  var ticks = 0;
  var id = setInterval(function () {
    if (document.querySelector('.pdf-page')) { run(); clearInterval(id); }
    if (++ticks > 3000) clearInterval(id);
  }, 10);
})();
</script>
